<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EV Charge</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px;
      background: #f5f7f5;
      color: #17342a;
      font: 18px/1.55 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(100%, 640px); }
    .mark {
      width: 72px;
      height: 72px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #0f3d2e;
      color: white;
      font-size: 40px;
    }
    h1 { margin: 24px 0 8px; font-size: clamp(2.4rem, 8vw, 4rem); line-height: 1; }
    p { max-width: 38rem; margin: 0 0 20px; }
    .card {
      margin-top: 32px;
      padding: 24px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 8px 30px rgb(15 61 46 / 12%);
    }
    a { color: #0b6d4c; font-weight: 650; }
    footer { margin-top: 28px; font-size: .9rem; color: #52685f; }
  </style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">⚡</div>
  <h1>EV Charge</h1>
  <p>A simple, private log for electric-vehicle charging sessions, costs and efficiency.</p>

  <section class="card">
    <p>EV Charge stores your records on your device. It has no accounts, ads, analytics or
      developer-operated cloud service.</p>
    <p><a href="privacy.html">Read the privacy policy</a></p>
  </section>

  <footer>EV Charge · Joe Desbonnet</footer>
</main>
</body>
</html>
